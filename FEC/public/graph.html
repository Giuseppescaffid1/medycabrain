<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medyca · Second Brain</title>
<style>
  :root{
    --accent:#E77C81; --bg:#101D36; --text-dim:rgba(238,245,253,0.45);
    --card:rgba(18,32,58,0.85); --line:rgba(213,227,242,0.12);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#fff}
  canvas#c{position:fixed;inset:0;display:block;touch-action:none}
  /* wordmark */
  #wordmark{position:fixed;top:16px;left:18px;z-index:5;pointer-events:none;user-select:none}
  #wordmark .row{display:flex;align-items:center;gap:9px}
  #wordmark svg{opacity:.9}
  #wordmark .w1{font-weight:700;font-size:15px;letter-spacing:.22em;color:#fff}
  #wordmark .w2{font-weight:400;font-size:15px;letter-spacing:.22em;color:rgba(255,255,255,.55)}
  #wordmark .by{margin-top:5px;font-size:8px;letter-spacing:.16em;color:rgba(255,255,255,.3);text-transform:uppercase}
  /* menu */
  #menu{position:fixed;top:16px;right:18px;z-index:7;background:transparent;color:var(--accent);
    border:1px solid var(--accent);border-radius:8px;padding:7px 12px;font-size:11px;letter-spacing:.12em;
    cursor:pointer;font-weight:600}
  #menu:hover{background:rgba(231,124,129,.12)}
  /* control panel */
  #panel{position:fixed;top:58px;right:18px;z-index:6;width:206px;background:var(--card);
    border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    padding:14px;display:flex;flex-direction:column;gap:12px;transition:opacity .18s,transform .18s}
  #panel.hide{opacity:0;transform:translateY(-8px);pointer-events:none}
  #panel input.search{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
    background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-family:inherit}
  #panel input.search:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .sect{font-size:7px;font-weight:700;letter-spacing:.18em;color:rgba(255,255,255,.35);text-transform:uppercase}
  .seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{flex:1;background:transparent;border:none;color:rgba(255,255,255,.6);padding:6px 2px;
    font-size:10px;letter-spacing:.04em;cursor:pointer;font-family:inherit;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:#000;font-weight:700}
  .row2{display:flex;gap:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:14px;height:14px}
  .sld label{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);margin-bottom:4px}
  .sld label b{color:var(--accent);font-weight:600;font-family:ui-monospace,Menlo,monospace}
  .sld input[type=range]{width:100%;height:2px;-webkit-appearance:none;background:rgba(255,255,255,.15);border-radius:2px}
  .sld input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
    background:var(--accent);cursor:pointer}
  .sld input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--accent);border:none;cursor:pointer}
  .ghost{background:transparent;border:1px solid var(--line);color:rgba(255,255,255,.7);border-radius:7px;
    padding:7px;font-size:10px;letter-spacing:.06em;cursor:pointer;font-family:inherit;flex:1}
  .ghost:hover{border-color:var(--accent);color:#fff}
  .bake{background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:7px;padding:8px;
    font-size:10px;letter-spacing:.1em;cursor:pointer;font-family:inherit;font-weight:600}
  .bake:hover{background:rgba(231,124,129,.12)}
  .logout{position:fixed;bottom:12px;right:20px;z-index:6;color:rgba(255,255,255,.3);font-size:10px;
    text-decoration:none;letter-spacing:.1em}
  .logout:hover{color:#fff}
  /* tooltip */
  #tip{position:fixed;z-index:9;pointer-events:none;background:rgba(14,26,48,.94);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;font-size:12px;display:none;max-width:260px}
  #tip .t1{font-weight:600;color:#fff}
  #tip .t2{font-size:10px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.03em}
  /* reader */
  #reader{position:fixed;top:0;right:0;height:100%;width:440px;max-width:90vw;background:rgba(14,26,48,.97);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .2s;z-index:8;overflow:auto;
    padding:20px 22px;backdrop-filter:blur(8px)}
  #reader.open{transform:translateX(0)}
  #reader .x{position:absolute;top:12px;right:16px;color:rgba(255,255,255,.5);cursor:pointer;font-size:1.4rem;line-height:1}
  #reader .x:hover{color:#fff}
  #reader .crumb{font-family:ui-monospace,Menlo,monospace;font-size:.76rem;color:var(--text-dim);margin:0 26px 12px 0}
  #reader .gtag{display:inline-block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;padding:2px 7px;
    border-radius:5px;margin-bottom:10px;font-weight:700}
  #reader h1{font-size:1.2rem;margin:0 0 12px}#reader h2,#reader h3{margin:16px 0 6px;font-size:1rem}
  #reader h2{border-top:1px solid var(--line);padding-top:12px}
  #reader .um{color:var(--text-dim);font-size:.75rem;font-style:italic;margin:2px 0 8px}
  #reader .ln{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:.81rem;line-height:1.5;color:#d3d8e2}
  #reader pre{background:#0B1428;border:1px solid var(--line);border-radius:8px;padding:11px 13px;overflow:auto}
  #reader pre code{font-family:ui-monospace,Menlo,monospace;font-size:.79rem;color:#d3d8e2}
  #reader code.inl{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Menlo,monospace;font-size:.79rem}
  #reader a.ptr{display:inline-flex;gap:5px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:6px;
    padding:1px 7px;font-size:.76rem;color:#7FA6D9;text-decoration:none;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
  #reader a.ptr .rel{color:var(--accent);font-weight:700}
  #reader a.ev{color:#7ED4B0;cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:.78rem}
  #reader a.ext{color:#7FA6D9}
  #reader .conns{margin-top:6px}
  #reader .cb{display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;margin:3px 5px 0 0;font-size:.76rem;cursor:pointer}
  #reader .cb .r{color:var(--accent);font-family:ui-monospace,Menlo,monospace;font-size:.68rem}
  /* phones: panel becomes a bottom sheet, hidden by default (toggle via MENU) */
  @media (max-width:640px){
    #panel{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:58vh;overflow:auto;gap:14px}
    #panel.hide{transform:translateY(130%);opacity:1}
    .seg button{padding:10px 2px;font-size:12px}
    .sld input[type=range]{height:3px}
    .sld input[type=range]::-webkit-slider-thumb{width:16px;height:16px}
    .sld input[type=range]::-moz-range-thumb{width:16px;height:16px}
    .ghost,.bake{padding:10px}
    .chk input{width:18px;height:18px}
    #wordmark .w1,#wordmark .w2{font-size:13px;letter-spacing:.16em}
    #wordmark .by{font-size:7px}
    #menu{padding:9px 13px}
    #reader{width:100%}
  }
</style></head>
<body>
<canvas id="c"></canvas>
<div id="wordmark">
  <div class="row">
    <svg width="20" height="22" viewBox="0 0 20 22"><path d="M10 1 L19 6 V16 L10 21 L1 16 V6 Z" fill="none" stroke="#E77C81" stroke-width="1.4"/></svg>
    <div><span class="w1">MEDYCA</span> <span class="w2">SECOND BRAIN</span></div>
  </div>
  <div class="by">pipeline · temi · reel · blog · opportunità</div>
</div>
<button id="menu">☰ MENU</button>
<div id="panel">
  <input class="search" id="q" placeholder="Cerca… ( / )" autocomplete="off">
  <div>
    <div class="sect">Layout</div>
    <div class="seg" id="segLayout" style="margin-top:6px">
      <button data-v="force" class="on">Force</button><button data-v="circle">Circle</button>
      <button data-v="hex">Hex</button><button data-v="rings">Rings</button>
    </div>
  </div>
  <div>
    <div class="sect">View</div>
    <div class="seg" id="segView" style="margin-top:6px">
      <button data-v="departments" class="on">Departments</button><button data-v="folders">Folders</button>
    </div>
  </div>
  <div class="sld"><label>Ring spin (rings) <b id="vSpin">0.20</b></label>
    <input type="range" id="spin" min="0" max="1" step="0.01" value="0.20"></div>
  <label class="chk"><input type="checkbox" id="fnames" checked> File names</label>
  <div class="sld"><label>Link springs <b id="vSpring">0.38</b></label>
    <input type="range" id="spring" min="0" max="1" step="0.01" value="0.38"></div>
  <div class="sld"><label>Circle / Hex size <b id="vSize">0.12</b></label>
    <input type="range" id="size" min="0" max="1" step="0.01" value="0.12"></div>
  <div class="row2"><button class="ghost" id="expand">Expand all</button><button class="ghost" id="collapse">Collapse all</button></div>
  <button class="bake" id="bake">Bake settings</button>
</div>

<div id="tip"><div class="t1"></div><div class="t2"></div></div>
<div id="reader"><span class="x" onclick="closeReader()">&times;</span><div id="rbody"></div></div>
<script>
"use strict";
const AMBER="#E77C81";
const HUE={applications:"#7FA6D9",community:"#5B8DD9",personal:"#E8D267",content:"#C77FD4",
  business:"#B9A6E8",product:"#7FD4D0",skills:"#E8763C",routines:"#E0B84A",memory:"#A88FD9"};
const SEG_DEPT={apis:"applications",errors:"content",workflows:"product",snippets:"business",
  agents:"community",decisions:"business"};
function hexToRgb(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(hex,a){const c=hexToRgb(hex);return"rgba("+c[0]+","+c[1]+","+c[2]+","+a+")";}
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let cssW=0,cssH=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cssW=window.innerWidth;cssH=window.innerHeight;
  cv.width=cssW*dpr;cv.height=cssH*dpr;}
window.addEventListener("resize",()=>{resize();});
resize();

let NODES=[],EDGES=[],NMAP={},ADJ={},CHILDREN={};
let cam={x:cssW/2,y:cssH/2,scale:1};
let layout="force",view="departments",showNames=true,collapsed=false;
let spin=0.20,spring=0.38,sizeK=0.12,ringPhase=0;
let focusId=null,lockId=null;
let tween=null; // {t0,dur,from:{id:{x,y}}}
const STARS=[];
for(let i=0;i<220;i++)STARS.push({x:(Math.random()-.5)*2600,y:(Math.random()-.5)*2000});

/* ── medycabrain node mapping (groups: hub, stage, theme, reel, blog, opportunity) ── */
const MHUE={stage:"#7FA6D9",theme:"#C77FD4",reel:"#7FA6D9",blog:"#67C99A",opportunity:"#E77C81",custom:"#F0B25C"};
function isHub(n){return n.group==="hub"||n.group==="stage"||n.group==="theme";}
function isCenter(n){return n.group==="hub";}
function segOf(n){return n.parent||null;}
function deptOf(n){return n.group;}
function hueOf(n){return n.group==="hub"?AMBER:(MHUE[n.group]||"#8AA");}
function shapeOf(n){
  if(n.group==="hub"||n.group==="theme"||n.group==="custom")return "badge";
  if(n.group==="stage")return "badge";
  if(n.group==="opportunity")return "donut";
  if(n.group==="blog")return "hex";
  return "circle";
}
function radiusOf(n){
  if(n.group==="hub")return 27;
  if(n.group==="theme")return 17;
  if(n.group==="custom")return 15;
  if(n.group==="stage")return 15;
  if(n.group==="opportunity")return 11;
  return 7;
}
function clusterOf(n){
  if(n.group==="hub")return "core";
  if(n.group==="stage")return "pipeline";
  if(n.group==="theme")return n.id;              /* each theme = its own constellation */
  if(n.parent)return n.parent;                    /* reels/blog orbit their theme */
  return n.group;
}

async function boot(){
  const _scope=new URLSearchParams(location.search).get("scope")||"medyca";
  const _tok=localStorage.getItem("brain_token")||"";
  const d=await(await fetch("/api/v1/second-brain/graph/?scope="+_scope,{headers:{Authorization:"Token "+_tok}})).json();
  NODES=d.nodes;EDGES=d.edges;
  NODES.forEach(n=>{NMAP[n.id]=n;ADJ[n.id]=[];n.r=radiusOf(n);n.hue=hueOf(n);n.shape=shapeOf(n);
    n.x=(Math.random()-.5)*300;n.y=(Math.random()-.5)*260;n.a=1;n.ta=1;});
  EDGES.forEach(e=>{if(NMAP[e.source]&&NMAP[e.target]){
    ADJ[e.source].push({o:e.target,e});ADJ[e.target].push({o:e.source,e});
    if(e.kind==="structure"){(CHILDREN[e.source]=CHILDREN[e.source]||[]).push(e.target);}}});
  document.getElementById("q").placeholder="Search "+NODES.length+" nodes… ( / )";
  applyLayout("force",false);
  requestAnimationFrame(frame);
}

// ---------- layout position functions (world coords, origin-centered) ----------
function clusters(){
  const m={};NODES.forEach(n=>{const c=clusterOf(n);(m[c]=m[c]||[]).push(n);});return m;}
function forcePos(){
  const cl=clusters(),keys=Object.keys(cl).filter(k=>k!=="core"),pos={};
  const R=300+spring*160;
  keys.forEach((k,i)=>{const ang=i/keys.length*Math.PI*2;const hx=Math.cos(ang)*R,hy=Math.sin(ang)*R;
    const arr=cl[k];arr.forEach((n,j)=>{
      if(isHub(n)){pos[n.id]={x:hx,y:hy};}
      else{const a2=j/Math.max(1,arr.length)*Math.PI*2;const rr=60+((j*53)%70);
        pos[n.id]={x:hx+Math.cos(a2)*rr,y:hy+Math.sin(a2)*rr};}});});
  (cl.core||[]).forEach(n=>{pos[n.id]=n.id==="sys:vm"?{x:0,y:0}:{x:0,y:-80};});
  return pos;}
function circlePos(){
  const order=["apis","errors","workflows","snippets","raw","skills","routines","memory","community"];
  const cl=clusters();let seq=[];order.forEach(k=>{if(cl[k])seq=seq.concat(cl[k].filter(n=>!isHub(n)));});
  const Rc=300+sizeK*260,pos={};seq.forEach((n,i)=>{const a=i/Math.max(1,seq.length)*Math.PI*2;
    pos[n.id]={x:Math.cos(a)*Rc,y:Math.sin(a)*Rc};});
  // hubs on inner ring
  const hubs=NODES.filter(isHub);hubs.forEach((n,i)=>{if(n.id==="sys:vm")return;
    const a=i/hubs.length*Math.PI*2;pos[n.id]={x:Math.cos(a)*140,y:Math.sin(a)*140};});
  pos["sys:vm"]={x:0,y:0};return pos;}
function hexPos(){
  const order=["apis","errors","workflows","snippets","raw","skills","routines","memory","community"];
  const cl=clusters();let seq=[];order.forEach(k=>{if(cl[k])seq=seq.concat(cl[k].filter(n=>!isHub(n)));});
  const S=30+sizeK*36,pos={};
  // spiral of axial hex cells
  const cells=[[0,0]];let q=0,r=0;const dirs=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
  let ring=1;while(cells.length<seq.length+40){q=ring;r=-ring;for(let s=0;s<6;s++){for(let k=0;k<ring;k++){cells.push([q,r]);q+=dirs[s][0];r+=dirs[s][1];}}ring++;}
  seq.forEach((n,i)=>{const[cq,cr]=cells[i+1]||[0,0];pos[n.id]={x:S*1.5*cq,y:S*Math.sqrt(3)*(cr+cq/2)};});
  const hubs=NODES.filter(isHub);hubs.forEach((n,i)=>{if(n.id==="sys:vm")return;const a=i/hubs.length*Math.PI*2;
    pos[n.id]={x:Math.cos(a)*120,y:Math.sin(a)*120};});
  pos["sys:vm"]={x:0,y:0};return pos;}
function ringMeta(){
  const order=["snippets","routines","memory","workflows","errors","skills","raw","apis"];
  const cl=clusters(),meta={};order.forEach((k,i)=>{if(!cl[k])return;
    meta[k]={R:150+i*64,nodes:cl[k],phase:i*0.6};});return meta;}
function ringsPos(){
  const meta=ringMeta(),pos={};
  Object.keys(meta).forEach(k=>{const m=meta[k];m.nodes.forEach((n,j)=>{
    const a=m.phase+ringPhase+j/Math.max(1,m.nodes.length)*Math.PI*2;
    pos[n.id]={x:Math.cos(a)*m.R,y:Math.sin(a)*m.R};});});
  NODES.forEach(n=>{if(!pos[n.id])pos[n.id]=n.id==="sys:vm"?{x:0,y:0}:{x:0,y:-70};});
  return pos;}
function layoutPos(name){return name==="force"?forcePos():name==="circle"?circlePos():
  name==="hex"?hexPos():ringsPos();}

function applyLayout(name,animate){
  layout=name;
  const from={};NODES.forEach(n=>{from[n.id]={x:n.x,y:n.y};});
  if(animate!==false){tween={t0:performance.now(),dur:900,from};}
  else{const p=layoutPos(name);NODES.forEach(n=>{const q=p[n.id];if(q){n.x=q.x;n.y=q.y;}});fit();}
  document.querySelectorAll("#segLayout button").forEach(b=>b.classList.toggle("on",b.dataset.v===name));
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

// ---------- focus ----------
function focusSet(id){
  if(!id)return null;const s=new Set([id]);
  const n=NMAP[id];
  if(n&&isHub(n)){(CHILDREN[id]||[]).forEach(c=>s.add(c));
    (CHILDREN[id]||[]).forEach(c=>(CHILDREN[c]||[]).forEach(g=>s.add(g)));s.add("sys:vm");}
  else{(ADJ[id]||[]).forEach(a=>s.add(a.o));}
  return s;}

// ---------- render ----------
function worldBounds(){return{x0:(-cam.x)/cam.scale,y0:(-cam.y)/cam.scale,
  x1:(cssW-cam.x)/cam.scale,y1:(cssH-cam.y)/cam.scale};}
function drawHexGrid(){
  const R=34,w=R*1.5,h=R*Math.sqrt(3),b=worldBounds();
  ctx.strokeStyle="rgba(190,210,255,0.045)";ctx.lineWidth=1/cam.scale;ctx.beginPath();
  const c0=Math.floor(b.x0/w)-1,c1=Math.ceil(b.x1/w)+1;
  for(let col=c0;col<=c1;col++){const cx=col*w,off=(col&1)?h/2:0;
    const r0=Math.floor((b.y0-off)/h)-1,r1=Math.ceil((b.y1-off)/h)+1;
    for(let row=r0;row<=r1;row++){const cy=row*h+off;
      for(let i=0;i<6;i++){const a=Math.PI/180*(60*i),x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();}}
  ctx.stroke();}
function drawStars(){ctx.fillStyle="rgba(255,255,255,0.05)";STARS.forEach(s=>{ctx.fillRect(s.x,s.y,1.1/cam.scale*1.1,1.1/cam.scale*1.1);});}
function shapePath(n,x,y,r){
  const sh=n.shape;
  if(sh==="hex"){ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i+30),px=x+r*Math.cos(a),py=y+r*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
  else if(sh==="sparkle"){ctx.beginPath();const R=r*1.5,rr=r*0.42;for(let i=0;i<8;i++){const a=Math.PI/4*i-Math.PI/2;const rad=i%2?rr:R;const px=x+rad*Math.cos(a),py=y+rad*Math.sin(a);i?ctx.lineTo(px,py):ctx.moveTo(px,py);}ctx.closePath();}
  else{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);}
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle="#101D36";ctx.fillRect(0,0,cssW,cssH);
  ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.scale,cam.scale);
  drawHexGrid();drawStars();
  const fset=focusSet(lockId||focusId);
  // update alpha targets
  NODES.forEach(n=>{n.ta=fset?(fset.has(n.id)?1:0.12):1;n.a+=(n.ta-n.a)*0.18;});
  // edges
  EDGES.forEach(e=>{const s=NMAP[e.source],t=NMAP[e.target];if(!s||!t)return;
    if(collapsed&&!(isHub(s)||isCenter(s))&&!(isHub(t)||isCenter(t)))return;
    const ea=Math.min(s.a,t.a);
    const touchF=fset&&(e.source===(lockId||focusId)||e.target===(lockId||focusId));
    const bothF=fset&&fset.has(e.source)&&fset.has(e.target);
    if(e.kind==="structure"&&(s.id==="sys:vm"||t.id==="sys:vm")){
      const hub=s.id==="sys:vm"?t:s;const lit=bothF;
      ctx.strokeStyle=rgba(hueOf(hub),(lit?0.7:0.22)*ea);ctx.lineWidth=(lit?1.4:0.75)/cam.scale;
      const mx=(s.x+t.x)/2,my=(s.y+t.y)/2,nx=-(t.y-s.y),ny=(t.x-s.x),L=Math.hypot(nx,ny)||1;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo(mx+nx/L*40,my+ny/L*40,t.x,t.y);ctx.stroke();
    }else if(e.kind==="structure"){
      const leaf=isHub(t)?s:t,lit=(fset&&(touchF||bothF));
      ctx.strokeStyle=lit?rgba(hueOf(leaf),0.7*ea):rgba(hueOf(leaf),0.10*ea);
      ctx.lineWidth=(lit?1.3:0.5)/cam.scale;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(t.x,t.y);ctx.stroke();
    }else{ // cross-cluster link
      const lit=bothF||touchF;
      ctx.strokeStyle=lit?rgba(hueOf(s),0.75):("rgba(255,255,255,"+(0.045*ea)+")");
      ctx.lineWidth=(lit?1.4:0.4)/cam.scale;
      ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(t.x,t.y);ctx.stroke();
      if(lit&&e.rel){ctx.fillStyle=rgba(AMBER,0.95);ctx.font=(10/cam.scale)+"px ui-monospace,Menlo,monospace";
        ctx.textAlign="center";ctx.fillText(e.rel,(s.x+t.x)/2,(s.y+t.y)/2-3/cam.scale);}
    }});
  // glow (additive)
  ctx.globalCompositeOperation="lighter";
  NODES.forEach(n=>{if(collapsed&&!(isHub(n)||isCenter(n)))return;if(n.a<0.03)return;
    const gr=Math.min(n.r*6,70/cam.scale),g=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,gr); // cap on-screen glow so zoomed-in nodes don't balloon
    g.addColorStop(0,rgba(n.hue,0.18*n.a));g.addColorStop(1,rgba(n.hue,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(n.x,n.y,gr,0,Math.PI*2);ctx.fill();});
  ctx.globalCompositeOperation="source-over";
  // cores
  NODES.forEach(n=>{if(collapsed&&!(isHub(n)||isCenter(n)))return;if(n.a<0.03)return;
    ctx.globalAlpha=n.a;
    if(n.shape==="badge"){const s=isCenter(n)?15:11;ctx.strokeStyle=rgba(n.hue,1);ctx.lineWidth=1.4;
      ctx.fillStyle=rgba(n.hue,0.12);roundRect(n.x-s,n.y-s,s*2,s*2,4);ctx.fill();ctx.stroke();
      // inner glyph = dept leaf shape
      const inner={shape:isCenter(n)?"hex":(deptOf(n)==="skills"?"sparkle":deptOf(n)==="routines"?"donut":deptOf(n)==="applications"?"hex":"circle")};
      ctx.fillStyle=rgba(n.hue,0.95);ctx.strokeStyle=rgba(n.hue,0.95);ctx.lineWidth=1.2;
      shapePath(inner,n.x,n.y,s*0.42);if(inner.shape==="donut"){ctx.stroke();}else{ctx.fill();}
    }else if(n.shape==="donut"){ctx.strokeStyle=rgba(n.hue,1);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);ctx.stroke();
    }else{ctx.fillStyle=rgba(n.hue,1);ctx.strokeStyle="#0a0c12";ctx.lineWidth=1.4;
      shapePath(n,n.x,n.y,n.r);ctx.fill();ctx.stroke();
      if(n.count){ctx.fillStyle="#fff";ctx.font="600 "+(9)+"px Inter,sans-serif";ctx.textAlign="center";ctx.fillText(n.count,n.x,n.y+3);}}
    ctx.globalAlpha=1;});
  // labels
  NODES.forEach(n=>{if(n.a<0.25)return;
    if(isHub(n)||isCenter(n)){if(collapsed&&false)return;
      ctx.globalAlpha=n.a;ctx.fillStyle="#fff";ctx.textAlign="center";
      ctx.font="700 "+(9)+"px Inter,sans-serif";
      const lab=(isCenter(n)?n.label:(n.label||"")).toUpperCase();
      spacedText(lab,n.x,n.y+(isCenter(n)?24:20),0.18);ctx.globalAlpha=1;
    }else if(showNames&&cam.scale>0.62&&!collapsed){
      ctx.globalAlpha=n.a*0.9;ctx.fillStyle="rgba(255,255,255,0.4)";ctx.textAlign="left";
      ctx.font="8px ui-monospace,Menlo,monospace";ctx.fillText(n.label,n.x+n.r+4,n.y+3);ctx.globalAlpha=1;}});
  ctx.restore();
  // tap ripples in screen space (instant touch feedback: amber=hit a node, grey=empty)
  const _n=nowms();
  for(let i=ripples.length-1;i>=0;i--){const rp=ripples[i],age=_n-rp.t;
    if(age>460){ripples.splice(i,1);continue;}
    const p=age/460;ctx.strokeStyle=rgba(rp.hit?AMBER:"#8b93a3",(1-p)*0.6);ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rp.x,rp.y,10+p*36,0,Math.PI*2);ctx.stroke();}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function spacedText(t,x,y,em){const fs=9,ls=fs*em;let total=0;const ws=[];
  for(const ch of t){const w=ctx.measureText(ch).width;ws.push(w);total+=w+ls;}
  let cx=x-total/2;ctx.textAlign="left";
  [...t].forEach((ch,i)=>{ctx.fillText(ch,cx,y);cx+=ws[i]+ls;});ctx.textAlign="center";}

function frame(now){
  if(layout==="rings"){ringPhase+=spin*0.006;}
  if(tween){const t=Math.min(1,(now-tween.t0)/tween.dur),e=ease(t),p=layoutPos(layout);
    NODES.forEach(n=>{const f=tween.from[n.id],q=p[n.id];if(f&&q){n.x=f.x+(q.x-f.x)*e;n.y=f.y+(q.y-f.y)*e;}});
    if(t>=1){tween=null;}}
  else if(layout==="rings"){const p=ringsPos();NODES.forEach(n=>{const q=p[n.id];if(q){n.x=q.x;n.y=q.y;}});}
  draw();requestAnimationFrame(frame);}

function fit(){
  const vis=NODES.filter(n=>!(collapsed&&!(isHub(n)||isCenter(n))));if(!vis.length)return;
  let a=1e9,b=1e9,c=-1e9,d=-1e9;vis.forEach(n=>{a=Math.min(a,n.x);b=Math.min(b,n.y);c=Math.max(c,n.x);d=Math.max(d,n.y);});
  const mob=cssW<=640,pad=mob?36:120,gw=(c-a)||1,gh=(d-b)||1;
  cam.scale=Math.min((cssW-pad*2)/gw,(cssH-pad*2)/gh,1.5);
  cam.scale=Math.max(cam.scale,mob?0.7:0.2);   // phones: don't shrink nodes to invisible dots (pan to explore)
  cam.x=cssW/2-cam.scale*(a+c)/2;cam.y=cssH/2-cam.scale*(b+d)/2;}

// ---------- interaction ----------
function screenToWorld(sx,sy){return{x:(sx-cam.x)/cam.scale,y:(sy-cam.y)/cam.scale};}
// hit-test in SCREEN space with a min tap radius; never skip dimmed nodes (no click-trap)
function pick(sx,sy){let best=null,bd=1e9;
  NODES.forEach(n=>{if(collapsed&&!(isHub(n)||isCenter(n)))return;
    const nx=n.x*cam.scale+cam.x,ny=n.y*cam.scale+cam.y,dd=(nx-sx)*(nx-sx)+(ny-sy)*(ny-sy);
    const hit=Math.max(n.r*cam.scale*1.6+12,30);   // finger target grows with the visible node
    if(dd<hit*hit&&dd<bd){bd=dd;best=n;}});return best;}

// ---- input: separate MOUSE and TOUCH paths (iOS WebViews break on pointer events) ----
const tipEl=document.getElementById("tip");
let gesture=null;          // {mode:'pan'|'node', n?, sx,sy, cx,cy, moved}
let pinch=null;            // {d, mx, my}
function hideTip(){tipEl.style.display="none";}
function startGesture(sx,sy){const n=pick(sx,sy);
  gesture=n?{mode:"node",n,sx,sy,moved:false}
           :{mode:"pan",sx,sy,cx:cam.x,cy:cam.y,moved:false};}
const TAP_SLOP=14;   // finger jitter under this many px is NOT a drag
function moveGesture(sx,sy){if(!gesture)return;
  if(!gesture.moved&&Math.hypot(sx-gesture.sx,sy-gesture.sy)<TAP_SLOP)return; // ignore jitter
  gesture.moved=true;
  if(gesture.mode==="pan"){cam.x=gesture.cx+(sx-gesture.sx);cam.y=gesture.cy+(sy-gesture.sy);}
  else{const w=screenToWorld(sx,sy);gesture.n.x=w.x;gesture.n.y=w.y;tween=null;}}
const ripples=[];
function doTapAt(sx,sy){const n=pick(sx,sy);
  ripples.push({x:sx,y:sy,t:nowms(),hit:!!n});   // visual confirmation every tap
  if(n){if(isHub(n)||isCenter(n)){lockId=(lockId===n.id?null:n.id);}else{openNode(n.id);}}
  else{lockId=null;focusId=null;hideTip();}}
function endGesture(){if(gesture&&!gesture.moved){
    if(gesture.mode==="node"){const n=gesture.n;
      if(isHub(n)||isCenter(n)){lockId=(lockId===n.id?null:n.id);}else{openNode(n.id);}}
    else{lockId=null;focusId=null;hideTip();}}
  gesture=null;}
function zoomAt(sx,sy,f){const gx=(sx-cam.x)/cam.scale,gy=(sy-cam.y)/cam.scale;
  cam.scale=Math.max(0.15,Math.min(4,cam.scale*f));cam.x=sx-gx*cam.scale;cam.y=sy-gy*cam.scale;}

// MOUSE (desktop)
cv.addEventListener("mousedown",e=>{startGesture(e.clientX,e.clientY);});
window.addEventListener("mousemove",e=>{
  if(gesture){moveGesture(e.clientX,e.clientY);hideTip();return;}
  const n=pick(e.clientX,e.clientY);focusId=n?n.id:null;
  if(n){tipEl.style.display="block";tipEl.style.left=(e.clientX+14)+"px";tipEl.style.top=(e.clientY+14)+"px";
    tipEl.querySelector(".t1").textContent=n.label;
    tipEl.querySelector(".t2").textContent=(isHub(n)||isCenter(n))?deptOf(n)+" · click to filter":((n.sub||deptOf(n))+" · "+(n.file?"click to read":"node"));
    cv.style.cursor="pointer";}
  else{hideTip();cv.style.cursor="default";}});
window.addEventListener("mouseup",()=>{endGesture();});
cv.addEventListener("wheel",e=>{e.preventDefault();
  let d=e.deltaY;if(e.deltaMode===1)d*=16;else if(e.deltaMode===2)d*=window.innerHeight;
  zoomAt(e.clientX,e.clientY,Math.exp(-d*0.0015));},{passive:false});

// TOUCH (iOS Safari / in-app WebView / Android) — real touch events, no pointer capture.
// A tap = short (<450ms) + small displacement (<18px); recognized regardless of jitter.
let tStart=null;
function nowms(){return (window.performance&&performance.now)?performance.now():Date.now();}
cv.addEventListener("touchstart",e=>{e.preventDefault();hideTip();
  if(e.touches.length>=2){gesture=null;tStart=null;const a=e.touches[0],b=e.touches[1];
    pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,mx:(a.clientX+b.clientX)/2,my:(a.clientY+b.clientY)/2};}
  else{pinch=null;const t=e.touches[0];tStart={x:t.clientX,y:t.clientY,ms:nowms()};
    startGesture(t.clientX,t.clientY);}},{passive:false});
cv.addEventListener("touchmove",e=>{e.preventDefault();
  if(e.touches.length>=2&&pinch){const a=e.touches[0],b=e.touches[1];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;
    const gx=(pinch.mx-cam.x)/cam.scale,gy=(pinch.my-cam.y)/cam.scale;
    cam.scale=Math.max(0.15,Math.min(4,cam.scale*(d/pinch.d)));
    cam.x=mx-gx*cam.scale;cam.y=my-gy*cam.scale;pinch={d,mx,my};return;}
  if(e.touches.length===1)moveGesture(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
cv.addEventListener("touchend",e=>{e.preventDefault();
  if(e.touches.length<2)pinch=null;
  if(e.touches.length===0){
    const t=e.changedTouches[0];
    const tap=tStart&&t&&(nowms()-tStart.ms)<450&&Math.hypot(t.clientX-tStart.x,t.clientY-tStart.y)<18;
    if(tap)doTapAt(tStart.x,tStart.y);   // pick at the touch-down point, jitter-proof
    gesture=null;tStart=null;
  }else{const t=e.touches[0];startGesture(t.clientX,t.clientY);if(gesture)gesture.moved=true;tStart=null;}},{passive:false});
cv.addEventListener("touchcancel",()=>{gesture=null;pinch=null;tStart=null;},{passive:false});

// ---------- panel wiring ----------
document.getElementById("segLayout").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;applyLayout(b.dataset.v,true);});
document.getElementById("segView").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  view=b.dataset.v;document.querySelectorAll("#segView button").forEach(x=>x.classList.toggle("on",x===b));applyLayout(layout,true);});
document.getElementById("spin").addEventListener("input",e=>{spin=+e.target.value;document.getElementById("vSpin").textContent=spin.toFixed(2);});
document.getElementById("spring").addEventListener("input",e=>{spring=+e.target.value;document.getElementById("vSpring").textContent=spring.toFixed(2);if(layout==="force")applyLayout("force",true);});
document.getElementById("size").addEventListener("input",e=>{sizeK=+e.target.value;document.getElementById("vSize").textContent=sizeK.toFixed(2);if(layout==="circle"||layout==="hex")applyLayout(layout,true);});
document.getElementById("fnames").addEventListener("change",e=>{showNames=e.target.checked;});
document.getElementById("expand").addEventListener("click",()=>{collapsed=false;fit();});
document.getElementById("collapse").addEventListener("click",()=>{collapsed=true;fit();});
document.getElementById("bake").addEventListener("click",e=>{const b=e.target;const o=b.textContent;b.textContent="Baked ✓";setTimeout(()=>b.textContent=o,1100);});
document.getElementById("menu").addEventListener("click",()=>{document.getElementById("panel").classList.toggle("hide");});
if(window.matchMedia("(max-width:640px)").matches)document.getElementById("panel").classList.add("hide"); // phones: start with graph unobstructed
const qbox=document.getElementById("q");
window.addEventListener("keydown",e=>{if(e.key==="/"&&document.activeElement!==qbox){e.preventDefault();qbox.focus();}
  if(e.key==="Escape"){lockId=null;closeReader();}});
qbox.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doSearch(qbox.value.trim());}});

async function doSearch(q){if(!q)return;const d=await(await fetch("/api/search?q="+encodeURIComponent(q))).json();
  if(d.error||!d.source){openText("no index match","no match for \""+q+"\"");return;}
  const id=d.source.path,n=NMAP[id];if(n){lockId=id;cam.scale=1.1;cam.x=cssW/2-cam.scale*n.x;cam.y=cssH/2-cam.scale*n.y;openNode(id);}}

// ---------- reader panel (markdown) ----------
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function inl(s){let t=esc(s);
  t=t.replace(/`([^`]+)`/g,(m,c)=>'<code class="inl">'+c+"</code>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t=t.replace(/(\b\w+)?-&gt;\s*([\w/.\-]+\.md)(#[\w %\-]+)?/g,(m,rel,p,anc)=>{const rh=rel?'<span class="rel">'+rel+"</span>-&gt; ":"";return '<a class="ptr" onclick="openNode(\''+p+"')\">"+rh+p+(anc||"")+"</a>";});
  t=t.replace(/Evidence:\s*(raw\/[\w/.\-]+)/g,'Evidence: <a class="ev" onclick="openNode(\'$1\')">$1</a>');
  t=t.replace(/(https?:\/\/[^\s()<]+)/g,'<a class="ext" href="$1" target="_blank" rel="noopener">$1</a>');return t;}
function md(text){const lines=text.split("\n");let h="",inC=false,buf=[];
  const fl=()=>{if(buf.length){h+="<pre><code>"+esc(buf.join("\n"))+"</code></pre>";buf=[];}};
  for(const raw of lines){if(raw.trim().indexOf("```")===0){inC?(fl(),inC=false):inC=true;continue;}
    if(inC){buf.push(raw);continue;}const m=raw.match(/^(#{1,6})\s+(.*)$/);
    if(m){const lv=m[1].length;h+=lv===1?'<h1>'+inl(m[2])+"</h1>":"<h"+lv+">"+inl(m[2])+"</h"+lv+">";continue;}
    if(/^_updated/.test(raw.trim())){h+='<div class="um">'+esc(raw.trim())+"</div>";continue;}
    if(raw.trim()===""){h+='<div style="height:6px"></div>';continue;}h+='<div class="ln">'+inl(raw)+"</div>";}
  if(inC)fl();return h;}
const reader=document.getElementById("reader"),rbody=document.getElementById("rbody");
function closeReader(){reader.classList.remove("open");lockId=null;focusId=null;}
function openText(title,sub){rbody.innerHTML="<h1>"+esc(title)+'</h1><div class="um">'+esc(sub)+"</div>";reader.classList.add("open");}
async function openNode(id){const n=NMAP[id];if(!n)return;lockId=id;
  const hue=hueOf(n);let h='<span class="gtag" style="background:'+hue+'22;color:'+hue+'">'+esc(deptOf(n))+"</span>";
  h+='<div class="crumb">'+esc(n.id)+"</div>";
  if(n.file){const d=await(await fetch("/api/file?path="+encodeURIComponent(n.file))).json();
    h+=d.content?md(d.content):'<div class="um">'+esc(d.error||"no content")+"</div>";}
  else{h+="<h1>"+esc(n.label)+"</h1>";if(n.sub)h+='<div class="um">'+esc(n.sub)+"</div>";
    if(n.detail)h+='<div class="ln">'+inl(n.detail)+"</div>";}
  const nb=ADJ[id]||[];if(nb.length){h+="<h3>connections ("+nb.length+")</h3><div class=\"conns\">";
    nb.forEach(a=>{const o=NMAP[a.o],dir=a.e.source===id?"→":"←",rel=a.e.rel?'<span class="r">'+dir+" "+a.e.rel+"</span> ":"";
      h+='<span class="cb" onclick="openNode(\''+a.o+"')\">"+rel+esc(o.label)+"</span>";});h+="</div>";}
  rbody.innerHTML=h;reader.classList.add("open");}
window.openNode=openNode;window.closeReader=closeReader;
boot();
</script>
</body></html>
