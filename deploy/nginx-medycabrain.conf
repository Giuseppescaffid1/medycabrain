# /etc/nginx/sites-available/medycabrain
# Install:
#   sudo cp deploy/nginx-medycabrain.conf /etc/nginx/sites-available/medycabrain
#   sudo ln -s /etc/nginx/sites-available/medycabrain /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d medycabrain.messtudent.com     # adds the 443 block + cert
#
# certbot rewrites this file to add `listen 443 ssl` + the cert paths and an
# HTTP->HTTPS redirect. Start with the HTTP block below; run certbot after DNS
# resolves.

server {
    listen 80;
    server_name medycabrain.messtudent.com;

    # Private client tool — keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    client_max_body_size 50M;

    root /home/giuseppe/projects/medycabrain/FEC/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /home/giuseppe/projects/medycabrain/BEC/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/giuseppe/projects/medycabrain/BEC/staticfiles/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
