# /etc/nginx/sites-enabled/medycabrain-port
# medycabrain preview on 81.17.96.27:9093
# Frontend (React SPA) served static; /api/ + /media/ + /static/ -> backend :8010.
# The app has its own login (DRF token) — that is the access gate.
server {
    listen 9093 default_server;
    server_name _;

    client_max_body_size 50M;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    root /home/giuseppe/projects/medycabrain/FEC/dist;
    index index.html;

    # The chat answer arrives token by token. Everything below is what stops
    # nginx from holding the whole reply and handing it over in one lump — the
    # classic silent failure, where the feature works locally and the live site
    # still shows 30 seconds of nothing. Django also sends X-Accel-Buffering:
    # no, so the stream survives this block being lost in a future edit.
    # proxy_read_timeout is an inactivity timer, not a total: 600s is slack for
    # the gap before the first token, not permission to run for ten minutes.
    location = /api/v1/knowledge/ask/stream/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;          # 1.0 has no chunked transfer encoding
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Interview uploads: audio/video files, hundreds of MB. The 50M server
    # ceiling is right for everything else and stays; only this endpoint is
    # allowed the big body. The transcription itself runs as a detached job,
    # so this request only carries the file and returns 202 — the long work
    # is not held on the connection.
    location /api/v1/uploads/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1G;
        proxy_request_buffering off;   # stream the upload straight through
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        alias /home/giuseppe/projects/medycabrain/BEC/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/giuseppe/projects/medycabrain/BEC/staticfiles/;
        expires 7d;
    }

    # Build output carries a content hash in the file name, so a file never
    # changes meaning: cache it hard. Serving it no-store made every visit
    # re-download the whole bundle, which is felt on a phone.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The page itself must never be reused: it is what points at the current
    # build. A stale copy names files that a later deploy deleted, and the app
    # then loads half-rendered.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    }
}
